[workspace]
members = [
    "crates/aranet-types",
    "crates/aranet-core",
    "crates/aranet-store",
    "crates/aranet-service",
    "crates/aranet-cli",
    "crates/aranet-tui",
    "crates/aranet-gui",
]
resolver = "3"

[workspace.package]
# The one version of every crate in this workspace. Don't edit it by hand:
# cargo-release bumps it, and the `aranet-*` entries below, together.
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cameronrye/aranet"
rust-version = "1.90"

[workspace.dependencies]
# Workspace crates. Published crates need a `version` next to `path`; keep it
# equal to `workspace.package.version` (cargo-release does).
aranet-types = { version = "0.2.0", path = "crates/aranet-types" }
aranet-core = { version = "0.2.0", path = "crates/aranet-core" }
aranet-store = { version = "0.2.0", path = "crates/aranet-store" }
aranet-service = { version = "0.2.0", path = "crates/aranet-service" }
# aranet-tui and aranet-gui each pick exactly one front end (`features = ["tui"]`
# or `["gui"]`). Edition 2024 only lets a member turn default features off when the
# workspace entry already does, so it is set here.
aranet-cli = { version = "0.2.0", path = "crates/aranet-cli", default-features = false }

btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
egui = "0.33"
eframe = "0.33"
futures = "0.3"
rand = "0.9"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
# rustls only, so no binary links OpenSSL through reqwest. Trust the OS certificate store
# (private CAs keep working) plus the bundled Mozilla roots (containers without ca-certificates).
# No http2/charset/system-proxy: HTTP/1.1 only; proxies come from HTTP_PROXY/HTTPS_PROXY/NO_PROXY.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }

[workspace.metadata.features]
default = ["cli"]
cli = []
tui = []
gui = []

# Build profile for cargo-dist releases
[profile.dist]
inherits = "release"
lto = "thin"

# Config for dist (cargo-dist), which generates .github/workflows/release.yml.
# After changing anything in these tables, regenerate the workflow with the
# pinned version (`dist generate`) and commit both. The workflow's plan job
# fails on every pull request while the two disagree.
[workspace.metadata.dist]
# The release workflow downloads exactly this version.
cargo-dist-version = "0.31.0"
ci = "github"
# Built once, in the build-global-artifacts job, from every target's archive.
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
pr-run-mode = "plan"
auto-includes = true
# Build each shipped package on its own (`cargo build --package ...`). Without
# this, one workspace build unifies features and the `aranet` CLI gets the
# `gui` feature that aranet-gui turns on, so the Linux CLI needs GTK.
precise-builds = true
# Our own job builds the per-target archives, so that the macOS binaries are
# signed before dist archives and checksums them (release-build-local.yml).
# release-macos-app.yml builds the signed, notarized Aranet.app DMGs.
build-local-artifacts = false
local-artifacts-jobs = ["./release-build-local", "./release-macos-app"]

# Pin every action dist writes into release.yml to a full commit SHA: the same
# commits as the hand-written workflows, plus the actions dist 0.31.0 only uses
# when other features are turned on. dist copies each value verbatim after the
# `@`, so the "# vX.Y.Z" suffix becomes the YAML comment that records the version.
[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0"
"actions/upload-artifact" = "b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0"
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0"
"actions/attest-build-provenance" = "96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0"
"swatinem/rust-cache" = "6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2"
"actions/setup-node" = "249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0"

# Linux build packages. aranet: dbus. aranet-gui: also gtk, xdo, xcb, xkbcommon.
# No OpenSSL: the shipped packages use rustls (see `reqwest` above).
[workspace.metadata.dist.dependencies.apt]
pkg-config = "*"
libdbus-1-dev = "*"
libgtk-3-dev = "*"
libxdo-dev = "*"
libxcb-render0-dev = "*"
libxcb-shape0-dev = "*"
libxcb-xfixes0-dev = "*"
libxkbcommon-dev = "*"
