# Aranet Service Configuration for Docker
#
# docker/Dockerfile bakes this file into the image as /app/server.toml, the
# path the service always reads. To change the configuration, mount a file
# over /app/server.toml (both compose files mount this one, read-only) and
# restart the container. The service runs as uid 999, so a mounted file must
# be readable by that uid.
#
# The service can't write the baked copy or a read-only mount, so adding,
# changing or removing a sensor through the API, the dashboard, the TUI or the
# GUI fails in the container: edit the file on the host instead. For the same
# reason, if you set security.api_key_enabled = true, also set
# security.api_key yourself: the service can't save a generated key here and
# would stop at startup.

[server]
# Bind to all interfaces for Docker networking
bind = "0.0.0.0:8080"
# Buffer size for WebSocket broadcast channel
broadcast_buffer = 100

[storage]
# Database path (mounted volume in Docker)
path = "/data/aranet.db"

[security]
# Prometheus in docker-compose scrapes with `Host: aranet-service:8080`. Without
# API-key authentication, requests for other host names get 421.
allowed_hosts = ["aranet-service"]
# The service refuses to listen on a network address such as 0.0.0.0 without
# API key authentication unless this is set. In the container that is safe
# only because the compose files publish port 8080 on 127.0.0.1. Before you
# publish it on any other address, set api_key_enabled = true instead, and give
# Prometheus the key (see the aranet job in prometheus.yml).
allow_unauthenticated_network = true

[prometheus]
# Enable Prometheus metrics endpoint at /metrics
enabled = true

# Optional: Push gateway for environments where scraping isn't possible
# push_gateway = "http://prometheus-pushgateway:9091"
# push_interval = 60

[mqtt]
# Enable MQTT publishing
enabled = false
# MQTT broker URL (use service name if running in same Docker network)
broker = "mqtt://mosquitto:1883"
# Topic prefix for published messages
topic_prefix = "aranet"
# Client ID for MQTT connection
client_id = "aranet-service"
# QoS level (0, 1, or 2)
qos = 1
# Retain messages on broker
retain = true
# Optional authentication
# username = "aranet"
# password = "secret"

[webhooks]
# Enable webhook notifications when thresholds are exceeded
enabled = false
# co2_threshold = 1000        # ppm (triggers "co2_high")
# radon_threshold = 300       # Bq/m³ (triggers "radon_high")
# battery_threshold = 10      # % (triggers "battery_low")
# cooldown_secs = 300         # seconds between repeat alerts per device

# [[webhooks.endpoints]]
# url = "https://hooks.slack.com/services/T00/B00/xxx"
# events = ["co2_high", "radon_high", "battery_low"]
# headers = { "Authorization" = "Bearer token" }

[influxdb]
# Enable InfluxDB v2 export
enabled = false
# InfluxDB server URL
# url = "http://influxdb:8086"
# API token for authentication
# token = "your-influxdb-token"
# Organization name
# org = "my-org"
# Bucket for storing measurements
# bucket = "aranet"
# Measurement name
# measurement = "aranet"
# Write precision: s, ms, us, or ns
# precision = "s"

# Devices to monitor
# Bluetooth needs a Linux host with BlueZ and the host's /run/dbus mounted
# read-only into the container (docker-compose.yml at the repository root
# does). Privileged mode, host networking and devices are not needed.

# [[devices]]
# address = "Aranet4 XXXXX"
# alias = "office"
# poll_interval = 60

# [[devices]]
# address = "Aranet4 YYYYY"
# alias = "bedroom"
# poll_interval = 120
