# Aranet Service Docker Compose
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# This sets up:
#   - aranet-service: The Aranet data collector and API (reads ./server.toml)
#   - prometheus: Metrics collection
#   - grafana: Visualization dashboards
#
# Access, from this host only (every port is published on 127.0.0.1):
#   - Aranet API: http://127.0.0.1:8080
#   - Prometheus: http://127.0.0.1:9090
#   - Grafana: http://127.0.0.1:3000 (log in as $GRAFANA_ADMIN_USER with
#     $GRAFANA_ADMIN_PASSWORD; by default admin and changeme)
# Prometheus scrapes aranet-service over aranet-network, which the loopback
# publishing doesn't affect.

services:
  aranet-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aranet-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - aranet-data:/data
      - ./server.toml:/app/server.toml:ro
      # Bluetooth on a Linux host with BlueZ: uncomment to reach it over the
      # host's system bus (see docker-compose.yml at the repository root).
      # - /run/dbus:/run/dbus:ro
    environment:
      - RUST_LOG=aranet_service=info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - aranet-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aranet-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - aranet-network
    depends_on:
      - aranet-service

  grafana:
    image: grafana/grafana:10.4.0
    container_name: aranet-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/aranet-dashboard.json
    networks:
      - aranet-network
    depends_on:
      - prometheus

volumes:
  aranet-data:
    name: aranet-data
  prometheus-data:
    name: aranet-prometheus-data
  grafana-data:
    name: aranet-grafana-data

networks:
  aranet-network:
    name: aranet-network
    driver: bridge
