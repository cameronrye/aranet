# Aranet Service: standalone Docker Compose
#
#   docker compose up -d
#
# Builds docker/Dockerfile and runs it with docker/server.toml, published on
# http://127.0.0.1:8080 only. Edit docker/server.toml to add sensors, then run
# `docker compose restart aranet-service`.
#
# On a Linux host with BlueZ, the service reaches Bluetooth over the host's
# system bus through the read-only /run/dbus mount: no privileged mode, host
# network or devices. Elsewhere (Docker Desktop on macOS or Windows) there is no
# Bluetooth; add `command: ["--no-collector"]` to run the API only.
#
# For the full monitoring stack (Prometheus + Grafana), use:
#   docker compose -f docker/docker-compose.yml up -d

services:
  aranet-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aranet-service
    restart: unless-stopped
    # The service can take 20 s to shut down cleanly (a Bluetooth poll in flight
    # disconnects, then the background tasks finish). Docker's default kills it after 10 s.
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Database
      - aranet-data:/data
      # Configuration (read-only: edit docker/server.toml on the host)
      - ./docker/server.toml:/app/server.toml:ro
      # BlueZ over the host's system bus. The directory, not the socket file,
      # so the container still reaches a restarted dbus-daemon.
      - /run/dbus:/run/dbus:ro
    # If the log shows org.freedesktop.DBus.Error.AccessDenied, the host's AppArmor
    # or SELinux filters D-Bus. Relax it for this container instead of using
    # privileged mode:
    # security_opt: ["apparmor=unconfined"]  # Ubuntu, if BlueZ calls fail with AccessDenied
    # security_opt: ["label=disable"]  # SELinux (Fedora, RHEL)
    environment:
      - RUST_LOG=aranet_service=info
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  aranet-data:
