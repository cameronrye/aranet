name: Deployment files

on:
  push:
    branches: [main]
  pull_request:
    # Everything that goes into the image or the deployment files. crates/** because
    # the image build compiles or loads every workspace member.
    paths:
      - "crates/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "distribution/systemd/**"
      - "scripts/ci/**"
      - ".github/workflows/deployment-files.yml"
  workflow_dispatch:

# Every job only reads the repository. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main each get
# their own group (by commit), so every commit on main is checked in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build and smoke-test the image
        run: scripts/ci/check-docker-image.sh

  systemd:
    name: systemd system service
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.90"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # libnss-systemd lets `ps` name the service's dynamic user.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config libnss-systemd

      - name: Build aranet-service
        run: cargo build --locked -p aranet-service

      - name: Install, run and uninstall the system service
        run: sudo scripts/ci/check-systemd-install.sh target/debug/aranet-service

  launchd-refusal:
    name: launchd system install is refused
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.90"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build aranet-service
        run: cargo build --locked -p aranet-service

      - name: sudo service install is refused and writes no LaunchDaemon
        run: |
          err_file="$RUNNER_TEMP/install.err"
          if sudo ./target/debug/aranet-service service install 2> "$err_file"; then
            echo "::error::sudo aranet-service service install succeeded on macOS"
            exit 1
          fi
          cat "$err_file"
          if ! grep -qF -- '--user' "$err_file"; then
            echo "::error::the refusal doesn't point to --user"
            exit 1
          fi
          if [ -e /Library/LaunchDaemons/dev.rye.aranet.plist ]; then
            echo "::error::/Library/LaunchDaemons/dev.rye.aranet.plist was written"
            exit 1
          fi
