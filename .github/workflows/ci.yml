name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repository. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main each get
# their own group (by commit), so every commit on main is checked in full.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.90"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Test (all features, Linux only)
        if: runner.os == 'Linux'
        run: cargo test --locked --workspace --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with rustfmt
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # msrv means env.RUST_TOOLCHAIN. stable is the newest Rust release, so new lints
        # and future-incompatibility warnings in workspace crates fail CI before they
        # become hard errors. For dependencies, cargo only prints a future-incompat note.
        toolchain: [msrv, stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev

      - name: Install Rust ${{ matrix.toolchain }} with clippy
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain == 'msrv' && env.RUST_TOOLCHAIN || matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps --all-features

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with clippy
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-hack
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-hack@0.6.45
          fallback: none

      # cargo-hack runs cargo once per package and feature set, so features are not
      # unified across workspace members the way `cargo build --workspace` unifies them.
      - name: Each feature of every package except aranet-cli
        run: cargo hack clippy --locked --workspace --exclude aranet-cli --each-feature --all-targets -- -D warnings

      # The `aranet` binary needs `cli` or `tui` (main.rs stops the build with
      # compile_error! otherwise), so only feature sets containing one of them.
      - name: aranet-cli feature sets that build the aranet binary
        run: cargo hack clippy --locked -p aranet-cli --feature-powerset --at-least-one-of cli,tui --all-targets -- -D warnings

      # The library on its own, including no features and `gui` only (what aranet-gui uses).
      - name: aranet-cli library, each feature
        run: cargo hack clippy --locked -p aranet-cli --lib --each-feature -- -D warnings

      # Two commands on purpose: `cargo build -p aranet-tui -p aranet-gui` would
      # unify aranet-cli's `tui` and `gui` features into a single build.
      - name: Build aranet-tui on its own
        run: cargo build --locked -p aranet-tui

      - name: Build aranet-gui on its own
        run: cargo build --locked -p aranet-gui

      # Tests per package, so no other member's features are unified in: the
      # feature set that ships (default = cli, tui), and tui only (cli_integration
      # has required-features = ["cli"] in crates/aranet-cli/Cargo.toml, so it is
      # skipped there).
      - name: Test aranet-cli with its default (released) features
        run: cargo test --locked -p aranet-cli

      - name: Test aranet-cli with only the tui feature
        run: cargo test --locked -p aranet-cli --no-default-features --features tui

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxdo-dev \
            libssl-dev

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with llvm-tools
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Generate coverage report
        run: cargo llvm-cov --locked --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
