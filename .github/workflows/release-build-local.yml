# Per-target release archives: dist's "build-local-artifacts" job, plus macOS signing.
#
# Cargo.toml sets `build-local-artifacts = false` and lists this workflow in
# `local-artifacts-jobs`, so the generated release.yml calls it with dist's plan
# instead of generating its own job. The steps are the job dist 0.31.0 generates,
# with these changes:
#   - Rust is pinned to 1.90, the toolchain CI tests with (ci.yml RUST_TOOLCHAIN).
#   - On macOS, `aranet` and `aranet-gui` are signed with the Developer ID
#     certificate *before* dist archives them: dist builds, the binaries are
#     signed where cargo keeps them, and a second `dist build` re-archives and
#     re-checksums the signed bytes. The archives, .sha256 files and dist manifest
#     therefore describe the signed binaries, and so do the installers and
#     sha256.sum that build-global-artifacts later makes from that manifest.
#   - The signed binaries are notarized.
#
# When changing cargo-dist-version: set `build-local-artifacts = true` in
# Cargo.toml, run `dist generate`, diff its build-local-artifacts job against
# this file, port any changes here, set it back to false and run `dist generate`
# again.
name: Release / build local artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    strategy:
      fail-fast: false
      # Runners, targets, dist install commands and apt packages all come from
      # [workspace.metadata.dist] in Cargo.toml, through the plan.
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      # The generated jobs get this from the plan job's `tag-flag` output: nothing
      # on pull requests, otherwise --tag=<the pushed tag>.
      TAG_FLAG: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      DIST_ARGS: ${{ matrix.dist_args }}
      TARGET: ${{ join(matrix.targets, '') }}
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.90"
      # The plan's install and apt commands are generated by dist from Cargo.toml,
      # not taken from the pull request or tag, and are shell commands by design.
      - name: Install dist
        run: ${{ matrix.install_dist.run }} # zizmor: ignore[template-injection]
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        if: ${{ matrix.packages_install }}
        run: ${{ matrix.packages_install }} # zizmor: ignore[template-injection]
      - name: Build artifacts
        shell: bash
        run: |
          # TAG_FLAG and DIST_ARGS each hold zero or more flags.
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"

      # ---- macOS: sign, then let dist archive the signed binaries ----
      - name: Check macOS signing credentials
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          HAS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_KEY != '' }}
          PUBLISHING: ${{ !github.event.pull_request }}
        run: |
          if [ "$HAS_CERTIFICATE" != "true" ] || [ "$HAS_NOTARY_KEY" != "true" ]; then
            if [ "$PUBLISHING" = "true" ]; then
              echo "::error::APPLE_CERTIFICATE and APP_STORE_CONNECT_KEY must be set to publish macOS binaries"
              exit 1
            fi
            echo "::warning::Apple signing secrets are not set; macOS binaries stay ad-hoc signed"
          fi
          echo "sign=$HAS_CERTIFICATE" >> "$GITHUB_OUTPUT"
          echo "notarize=$HAS_NOTARY_KEY" >> "$GITHUB_OUTPUT"
      - name: Sign macOS binaries
        if: runner.os == 'macOS' && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The certificate lives in a temporary keychain only for this step, after
          # every build script has run and before the second `dist build`.
          keychain="$RUNNER_TEMP/aranet-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          CODESIGN_KEYCHAIN="$keychain" scripts/release/sign-macos-binaries.sh \
            "$TARGET" "Developer ID Application: Cameron Rye ($APPLE_TEAM_ID)"
          security delete-keychain "$keychain"
      - name: Archive the signed binaries
        if: runner.os == 'macOS' && steps.signing.outputs.sign == 'true'
        shell: bash
        run: |
          # Nothing is recompiled; dist re-archives the signed binaries and writes
          # new .sha256 files and a new manifest.
          # shellcheck disable=SC2086
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
      - name: Check the archives contain the signed binaries
        if: runner.os == 'macOS' && steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/release/verify-macos-archives.sh "$TARGET" dist-manifest.json \
            "Developer ID Application: Cameron Rye ($APPLE_TEAM_ID)"
      - name: Notarize macOS binaries
        if: runner.os == 'macOS' && steps.signing.outputs.sign == 'true' && steps.signing.outputs.notarize == 'true'
        shell: bash
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Notarization registers the signed binaries with Apple. It does not
          # change them, so the archives and checksums above stay valid.
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$key"
          mkdir -p "$RUNNER_TEMP/notarize"
          cp "target/$TARGET/dist/aranet" "target/$TARGET/dist/aranet-gui" "$RUNNER_TEMP/notarize/"
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --output-format json | tee "$RUNNER_TEMP/notarize.json"
          rm -f "$key"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notarize.json"
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/aranet-signing.keychain-db" 2>/dev/null || true
      # ---- end of macOS signing ----

      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
