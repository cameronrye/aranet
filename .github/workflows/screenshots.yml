name: Generate Screenshots

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  generate-screenshots:
    runs-on: macos-latest
    permissions:
      contents: write # push the screenshots to a `screenshots/<ref>` branch (main is protected)
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.90"

      - name: Install VHS
        run: |
          brew install vhs
          brew install optipng gifsicle

      # No actions/cache here: this job has a write token and runs once per release,
      # so it builds from scratch rather than trusting a restored ~/.cargo/bin or target/.
      - name: Build aranet binaries
        run: |
          cargo build --locked -p aranet-cli --release
          cargo build --locked -p aranet-gui --release

      - name: Generate VHS recordings
        run: |
          mkdir -p assets/screenshots
          for tape in scripts/tapes/*.tape; do
            if [ -f "$tape" ]; then
              echo "Recording: $tape"
              vhs "$tape" || echo "Warning: Failed to record $tape"
            fi
          done

      - name: Generate GUI screenshot
        run: |
          # Run GUI in demo mode and capture screenshot
          # Note: This requires a display - using virtual framebuffer on Linux
          ./target/release/aranet-gui --demo --screenshot assets/screenshots/gui-main.png --screenshot-delay 20 || true

      - name: Optimize images
        run: |
          # Optimize PNGs
          for png in assets/screenshots/*.png; do
            if [ -f "$png" ]; then
              optipng -quiet "$png" || true
            fi
          done
          # Optimize GIFs
          for gif in assets/screenshots/*.gif; do
            if [ -f "$gif" ]; then
              gifsicle -O3 --colors 256 "$gif" -o "$gif" || true
            fi
          done

      - name: Validate generated screenshots
        run: |
          failed=0
          for gif in assets/screenshots/*.gif; do
            size=$(stat -f%z "$gif" 2>/dev/null || stat -c%s "$gif" 2>/dev/null)
            echo "$gif: ${size} bytes"
            if [ "$size" -lt 30000 ]; then
              echo "::warning::$gif looks too small (${size} bytes) — VHS recording may have failed"
              failed=1
            fi
          done
          ls -la assets/screenshots/
          if [ "$failed" -eq 1 ]; then
            echo "::warning::Some screenshots may be broken. Skipping commit."
            echo "SCREENSHOTS_VALID=false" >> "$GITHUB_ENV"
          else
            echo "SCREENSHOTS_VALID=true" >> "$GITHUB_ENV"
          fi

      - name: Sync to website
        if: env.SCREENSHOTS_VALID == 'true'
        run: cp assets/screenshots/* website/public/screenshots/

      - name: Push screenshots branch
        if: env.SCREENSHOTS_VALID == 'true'
        env:
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/ website/public/screenshots/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="screenshots/${REF_NAME}"
          git commit -m "docs: update screenshots for ${REF_NAME}"
          # main is protected: push a branch and open a PR from it by hand.
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
          {
            echo "Screenshots pushed to \`${BRANCH}\`."
            echo "Open a PR: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
